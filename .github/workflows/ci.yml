name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install test and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev xvfb python3-gi python3-pil gir1.2-gtk-4.0 gir1.2-adw-1
      - name: Search regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Adw UI smoke
        run: xvfb-run -a python3 -m unittest tests.test_udfarama.MainGuardTests.test_adw_window_smoke -v
      - name: Build Debian package
        run: python3 tools/build_deb.py
      - name: Validate package contents
        run: |
          arch="$(dpkg --print-architecture)"
          package="dist/${arch}/UDFarama.deb"
          test -f "$package"
          dpkg-deb -I "$package"
          dpkg-deb -c "$package" | grep -E 'usr/bin/udfarama|usr/lib/udfarama/src/udfarama/__main__.py|com.adalettekno.UDFarama.desktop'
      - uses: actions/upload-artifact@v7
        with:
          name: UDFarama-deb
          path: dist/*/UDFarama.deb

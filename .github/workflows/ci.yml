name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Search regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev
      - name: Build Debian package
        run: python3 tools/build_deb.py
      - name: Validate package contents
        run: |
          arch="$(dpkg --print-architecture)"
          package="dist/${arch}/UDFarama.deb"
          test -f "$package"
          dpkg-deb -I "$package"
          dpkg-deb -c "$package" | grep -E 'usr/bin/udfarama|usr/lib/udfarama/src/udfarama/__main__.py|com.adalettekno.UDFarama.desktop'
      - uses: actions/upload-artifact@v4
        with:
          name: UDFarama-deb
          path: dist/*/UDFarama.deb
